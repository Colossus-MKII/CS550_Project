[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cs550-multi-object-segmentation"
version = "0.1.0"
description = "Reproducible starter for multi-category video segmentation and tracking experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
vision = ["Pillow>=10.4,<13"]
yolo = ["ultralytics==8.4.63", "Pillow>=10.4,<13"]
evaluation = ["pycocotools>=2.0.9,<3", "numpy>=1.26,<3"]

[project.scripts]
cs550 = "cs550_mots.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

